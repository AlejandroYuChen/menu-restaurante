
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menú del Día</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f3ee;
            color: #333;
            padding: 25px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        header {
            background: #263b30;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            font-size: 30px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        header p {
            font-size: 15px;
            color: #d5dfd6;
        }

        .fecha {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }

        .menu {
            padding: 0 25px 25px;
        }

        .plato {
            padding: 20px 0;
            border-bottom: 1px solid #e8e8e8;
        }

        .categoria {
            color: #71866b;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .plato h2 {
            font-size: 23px;
            margin-bottom: 8px;
            color: #263b30;
        }

        .plato p {
            font-size: 15px;
            line-height: 1.6;
            color: #666;
        }

        .mensaje {
            text-align: center;
            padding: 25px;
            background: #263b30;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .sin-menu {
            text-align: center;
            padding: 40px 20px;
            color: #777;
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 25px;
            }

            .plato h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>MENÚ DEL DÍA</h1>
            <p>Una experiencia diferente cada día</p>
        </header>

        <div class="fecha" id="fecha"></div>

        <main class="menu" id="menu">

            <section class="plato">
                <div class="categoria">Entrada</div>
                <h2 id="entrada"></h2>
                <p id="descripcionEntrada"></p>
            </section>

            <section class="plato">
                <div class="categoria">Plato fuerte</div>
                <h2 id="fuerte"></h2>
                <p id="descripcionFuerte"></p>
            </section>

            <section class="plato">
                <div class="categoria">Postre</div>
                <h2 id="postre"></h2>
                <p id="descripcionPostre"></p>
            </section>

        </main>

        <div class="mensaje">
            ¡Buen provecho!
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
